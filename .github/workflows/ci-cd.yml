name: CI / CD

on:
  push:
    branches:
      - main
      - master        # trigger when repo uses the old default branch
  workflow_dispatch:   # allow manual runs from the Actions tab

env:
  IMAGE_NAME: lichbalab/llabdocs-images
  REGISTRY: docker.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # allow pushing changes to the helm-chart repo

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build with Maven (skip tests for speed – adjust if needed)
        run: mvn -B -ntp -DskipTests package

      - name: Define image tag
        id: vars
        run: echo "tag=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}

      # ------------------------------------------------------------------
      # Update helm-chart repository with new image tag
      # ------------------------------------------------------------------
      - name: Clone deployment repo
        run: |
          git clone https://x-access-token:${{ secrets.DEPLOY_REPO_PAT }}@github.com/lichbalab/llabdocs-deployment.git
      - name: Update values.yaml
        working-directory: llabdocs-deployment
        run: |
          sed -i -E "s/(tag: ).*/\1${{ steps.vars.outputs.tag }}/" values.yaml
      - name: Commit & push changes
        working-directory: llabdocs-deployment
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add values.yaml
            git commit -m "chore: update image tag to ${{ steps.vars.outputs.tag }}"
            git push
          fi
